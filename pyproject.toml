[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "zq-vpc"
version = "0.1.0"
description = "Local isolated Docker cage and multi-project sync/exec bridge for overseas Claude Code"
requires-python = ">=3.9"
dependencies = [
    "PyYAML>=6.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

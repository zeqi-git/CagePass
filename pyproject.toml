[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cagepass"
version = "0.1.0"
description = "Local isolated offline Docker vault and file-RPC bridge for overseas Claude Code + local AI agent workflows"
requires-python = ">=3.9"
dependencies = [
    "PyYAML>=6.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
